# Stack RAG completo. En macOS (Mac Mini) Ollama corre NATIVO en el host
# (Docker no accede a la GPU Metal) — misma convención que ocr_pdf_markdown.
# En Linux se puede usar el profile `bundled-ollama`.
#
#   docker compose up -d --build                  # qdrant + backend + frontend
#   docker compose --profile ingest run --rm ingest        # ingesta incremental
#   docker compose --profile public up -d cloudflared      # exposición pública
#
# Config: copia .env.example → .env

name: sein-rag

services:
  qdrant:
    image: qdrant/qdrant:v1.18.3@sha256:0bd98fa7977f1e75694779359ca4e212822e5a71334e28421182f72f209d5286
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"   # solo loopback: la API pública pasa por nginx
    volumes:
      - qdrant_data:/qdrant/storage
    # Techos explícitos: el Mac Mini de 16GB corre además Ollama nativo y el
    # pipeline OCR. Sin límites, el OOM killer elegía víctima al azar y lo
    # más probable era perder el índice.
    mem_limit: ${QDRANT_MEM_LIMIT:-3g}
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      RAG_QDRANT_URL: http://qdrant:6333
      RAG_OLLAMA_HOST: ${RAG_OLLAMA_HOST:-http://host.docker.internal:11434}
      RAG_LLM_MODEL: ${RAG_LLM_MODEL:-qwen3.5:4b}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      # Proveedor de generación: ollama (local) o deepseek (nube). La clave
      # viaja solo por entorno desde .env; no la pongas aquí ni en command.
      RAG_LLM_PROVIDER: ${RAG_LLM_PROVIDER:-ollama}
      RAG_DEEPSEEK_MODEL: ${RAG_DEEPSEEK_MODEL:-deepseek-v4-flash-vision-exp}
      RAG_DEEPSEEK_API_KEY: ${RAG_DEEPSEEK_API_KEY:-}
      RAG_COLLECTION: ${RAG_COLLECTION:-sein_contracts}
      RAG_API_KEY: ${RAG_API_KEY:-}
      # Sin clave, el backend se niega a arrancar salvo que se pida
      # explícitamente el modo anónimo.
      RAG_ALLOW_ANONYMOUS: ${RAG_ALLOW_ANONYMOUS:-false}
      # Chat público con cuota diaria por IP (la API key la salta).
      RAG_PUBLIC_CHAT: ${RAG_PUBLIC_CHAT:-false}
      RAG_CHAT_DAILY_LIMIT: ${RAG_CHAT_DAILY_LIMIT:-5}
      RAG_QUOTA_DB_PATH: /data/quota/quota.sqlite3
      RAG_CORS_ORIGINS: ${RAG_CORS_ORIGINS:-}
      RAG_LOG_LEVEL: ${RAG_LOG_LEVEL:-INFO}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux; en macOS ya existe
    depends_on:
      qdrant:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"   # debug local; el tráfico real entra por nginx
    volumes:
      # La cuota debe sobrevivir a `up -d --build`: en el filesystem del
      # contenedor, cada deploy regalaba cuota fresca a quien abusara.
      - quota_state:/data/quota
    mem_limit: ${BACKEND_MEM_LIMIT:-1g}

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # Solo loopback por defecto: nginx proxea /api/ al backend, así que
      # publicarlo en 0.0.0.0 ponía toda la API al alcance de cualquiera en
      # la LAN, saltándose por completo el túnel de Cloudflare y sus
      # políticas de acceso. Para exponerlo en la red local hay que pedirlo:
      #   FRONTEND_BIND=0.0.0.0 docker compose up -d
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-8080}:80"
    mem_limit: ${FRONTEND_MEM_LIMIT:-256m}

  # --- Ingesta one-shot (idempotente, segura de re-correr) ---
  ingest:
    build: ./backend
    profiles: ["ingest"]
    command: ["sein-rag-ingest"]
    environment:
      RAG_QDRANT_URL: http://qdrant:6333
      RAG_OLLAMA_HOST: ${RAG_OLLAMA_HOST:-http://host.docker.internal:11434}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      RAG_COLLECTION: ${RAG_COLLECTION:-sein_contracts}
      RAG_VAULT_DIR: /data/vault
      RAG_MANIFEST_PATH: /data/index/ingest_manifest.jsonl
      RAG_LOG_LEVEL: ${RAG_LOG_LEVEL:-INFO}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${VAULT_DIR:-./data/vault}:/data/vault:ro
      - index_state:/data/index
    depends_on:
      qdrant:
        condition: service_healthy

  # --- Solo Linux: Ollama en contenedor ---
  ollama:
    image: ollama/ollama:0.32.4
    profiles: ["bundled-ollama"]
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"

  # --- Exposición pública sin abrir puertos: Cloudflare Tunnel ---
  cloudflared:
    image: cloudflare/cloudflared:2026.7.3@sha256:e39ee8da81ad5e05d77f38d2f51c60ca51bf2a8450ac3abab50c17fdb91d91bf
    profiles: ["public"]
    restart: unless-stopped
    # El token va por entorno, no en `command`: como argumento acababa en el
    # array Cmd del contenedor, visible con `docker inspect`, en `docker ps
    # --no-trunc` y en texto plano en config.v2.json. Quien lo leyera podía
    # levantar su propio cloudflared para el mismo hostname.
    # Dos modos, excluyentes:
    #  1. Token (túnel creado en el dashboard): define CLOUDFLARE_TUNNEL_TOKEN.
    #  2. Local (túnel creado con `cloudflared tunnel create`): define
    #     CLOUDFLARED_DIR apuntando a un directorio con config.yml (tunnel,
    #     credentials-file, ingress) y el JSON de credenciales. El directorio
    #     vive FUERA del repo: contiene el secreto del túnel.
    command: tunnel --no-autoupdate run
    environment:
      # Sin `:?`: compose interpola TODOS los servicios aunque el profile no
      # esté activo, así que el error rompía el `up` básico sin túnel. Si no
      # hay ni token ni config montada, cloudflared muere con error explícito.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    volumes:
      - ${CLOUDFLARED_DIR:-/var/empty}:/etc/cloudflared:ro
    mem_limit: ${TUNNEL_MEM_LIMIT:-256m}
    depends_on:
      - frontend

volumes:
  qdrant_data:
  index_state:
  quota_state:
  ollama_models:
