name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Mínimo privilegio: ningún job de CI necesita escribir en el repo.
permissions:
  contents: read

# Un push nuevo al mismo PR cancela la corrida anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.8.17"

jobs:
  backend:
    name: Backend (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      # --locked falla si uv.lock no corresponde a pyproject.toml: es el
      # único control real de deriva del lockfile.
      - name: Sync (lockfile estricto)
        run: uv sync --locked --group dev
      - name: Lint
        run: |
          uv run ruff check src tests eval
          uv run ruff format --check src tests eval
      - name: Tests + cobertura
        run: uv run pytest --cov-report=xml
      - name: Publicar cobertura al fallar
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-backend-py${{ matrix.python }}
          path: |
            backend/coverage.xml
            backend/.coverage
          retention-days: 7
          if-no-files-found: ignore

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # El job anterior nunca corría los tests ni el linter: un PR que
      # rompiera el chat entero salía verde.
      - run: npm run coverage
      - run: npm run build
      - name: Publicar cobertura al fallar
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-frontend
          path: frontend/coverage
          retention-days: 7
          if-no-files-found: ignore

  audit:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: pip-audit (backend)
        working-directory: backend
        run: |
          uv export --locked --no-dev --no-emit-project \
            --format requirements-txt -o requirements.txt
          uvx pip-audit --strict --requirement requirements.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm audit (frontend)
        working-directory: frontend
        run: npm audit --audit-level=high

  docker:
    name: Imágenes Docker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build backend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: backend
          load: true
          tags: sein-rag-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: frontend
          load: true
          tags: sein-rag-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # Construir no prueba nada: el job anterior nunca ARRANCABA las
      # imágenes, así que un venv mal copiado entre etapas o un entrypoint
      # roto se publicaba en verde.
      # Red propia con alias `backend`: es el nombre que nginx proxea, así
      # que sin ella el frontend no se prueba contra nada real.
      - name: Crear la red del stack
        run: docker network create sein-ci

      - name: El backend arranca y responde
        run: |
          docker run -d --name api --network sein-ci --network-alias backend \
            -p 8000:8000 -e RAG_ALLOW_ANONYMOUS=true \
            sein-rag-backend:ci
          for i in $(seq 1 30); do
            code=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' http://localhost:8000/api/health || true)
            # 503 también vale: significa que la app responde, y sin Qdrant
            # ni Ollama en CI el estado degradado es el esperado.
            if [ "$code" = "200" ] || [ "$code" = "503" ]; then
              echo "backend responde con $code"; exit 0
            fi
            sleep 2
          done
          echo "el backend no respondió"; docker logs api; exit 1

      - name: Sin clave y sin modo anónimo, el backend se niega a arrancar
        run: |
          # `timeout` es imprescindible: si la guarda se rompiera, uvicorn
          # arrancaría y serviría para siempre, y el job se colgaría hasta el
          # límite de GitHub en vez de fallar.
          set +e
          timeout 60 docker run --rm sein-rag-backend:ci \
            uvicorn rag.api.main:app --host 0.0.0.0 --port 8000 >out.log 2>&1
          code=$?
          set -e
          cat out.log
          if [ "$code" -eq 0 ]; then
            echo "FALLO: arrancó sin API key; la guarda no funciona"; exit 1
          fi
          if [ "$code" -eq 124 ]; then
            echo "FALLO: siguió sirviendo sin API key hasta el timeout"; exit 1
          fi
          grep -q "RAG_API_KEY" out.log

      - name: El frontend sirve la SPA
        run: |
          docker run -d --name web --network sein-ci -p 8080:80 sein-rag-frontend:ci
          for i in $(seq 1 20); do
            curl -fsS --max-time 10 http://localhost:8080/ >/dev/null 2>&1 && break
            sleep 1
          done
          if ! curl -fsS --max-time 10 http://localhost:8080/ >/tmp/spa.html; then
            echo "FALLO: nginx no sirvió la SPA"
            docker logs --tail 15 web 2>&1 | cut -c1-300 || true
            exit 1
          fi
          grep -qi "<div id=\"root\"" /tmp/spa.html
          echo "OK: la SPA se sirve"

      - name: La cabecera CSP está presente
        run: curl -sI --max-time 10 http://localhost:8080/ | grep -qi "content-security-policy"

      # Lo que de verdad importa del frontend: que el proxy llegue al backend.
      # El healthcheck anterior solo probaba index.html desde disco y daba
      # "healthy" con el backend caído.
      - name: El proxy /api/ alcanza al backend
        run: |
          code=$(curl -s --max-time 30 -o /dev/null -w '%{http_code}' http://localhost:8080/api/health)
          echo "GET /api/health via nginx -> $code"
          test "$code" = "200" || test "$code" = "503"

      - name: Ninguna imagen corre como root
        run: |
          for img in sein-rag-backend:ci sein-rag-frontend:ci; do
            uid=$(docker run --rm --entrypoint id "$img" -u 2>/dev/null || echo skip)
            echo "$img uid=$uid"
          done
          test "$(docker run --rm --entrypoint id sein-rag-backend:ci -u)" != "0"

      - name: El golden set no viaja en la imagen
        run: |
          if docker run --rm --entrypoint ls sein-rag-backend:ci /app/eval 2>/dev/null; then
            echo "eval/ está dentro de la imagen de producción"; exit 1
          fi

      - name: Reportar tamaño de las imágenes
        run: |
          for img in sein-rag-backend:ci sein-rag-frontend:ci; do
            size=$(docker image inspect "$img" --format '{{.Size}}')
            echo "$img: $((size / 1024 / 1024)) MB" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      # Diagnóstico acotado: volcar los logs enteros llenaba la salida de
      # trazas JSON de varios KB por línea y enterraba el error real.
      - name: Diagnóstico al fallar
        if: failure()
        run: |
          echo "=== contenedores ==="
          docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' || true
          echo "=== backend (api), últimas 15 líneas ==="
          docker logs --tail 15 api 2>&1 | cut -c1-300 || true
          echo "=== frontend (web), últimas 15 líneas ==="
          docker logs --tail 15 web 2>&1 | cut -c1-300 || true
