# Frontend estático + reverse proxy al backend.
# Rate limit básico para exposición pública (Cloudflare Tunnel apunta aquí).
limit_req_zone $binary_remote_addr zone=chat:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # SPA: cualquier ruta no-API sirve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /api/chat {
        limit_req zone=chat burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        # SSE: sin buffering ni timeouts cortos
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
