# Frontend estático + reverse proxy al backend.

# Detrás de Cloudflare Tunnel todas las peticiones llegan desde la IP del
# contenedor `cloudflared`, así que `$binary_remote_addr` era una constante
# para todo internet: el rate limit se convertía en un único cubo global —dos
# analistas simultáneos se bloqueaban entre sí y un atacante podía dejar fuera
# a todo el mundo desde una sola máquina—. Con real_ip, la clave vuelve a ser
# la IP real del cliente.
set_real_ip_from 0.0.0.0/0;
set_real_ip_from ::/0;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

limit_req_zone $binary_remote_addr zone=chat:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx expone su versión exacta en cada respuesta y en las páginas de error.
    server_tokens off;

    # El backend no debería recibir cuerpos grandes: `history` está acotado
    # en el esquema, esto es el cinturón de seguridad en el borde.
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # Cabeceras de seguridad. La app se despliega en un hostname público, y
    # sin frame-ancestors se podía enmarcar para robar por clickjacking la
    # API key que el usuario teclea en el panel de ajustes.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    # En una sola línea a propósito: nginx conserva literalmente el salto de
    # línea dentro de una cadena entrecomillada, así que partir el valor con
    # `\` metía saltos crudos en la cabecera y la respuesta HTTP salía
    # malformada. nginx registraba 200 y el cliente rechazaba la respuesta.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # SPA: cualquier ruta no-API sirve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # DNS embebido de Docker + upstream en variable. Con el hostname
    # literal en `proxy_pass`, nginx lo resuelve al arrancar: si el backend
    # aún no existe, nginx muere con "host not found in upstream" y el único
    # ingress del stack se queda abajo. Y una vez resuelto, cachea esa IP para
    # siempre, así que un backend recreado con IP nueva deja el proxy
    # apuntando a una dirección muerta. Con resolver + variable, nginx arranca
    # igualmente (devolviendo 502 mientras el backend no esté) y re-resuelve.
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $backend_upstream "backend:8000";

    location = /api/chat {
        limit_req zone=chat burst=5 nodelay;
        proxy_pass http://$backend_upstream$request_uri;
        proxy_http_version 1.1;
        # SSE: sin buffering ni timeouts cortos
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://$backend_upstream$request_uri;
        # /api/documents pagina la colección entera; el default de 60s daba
        # 504 con un índice grande.
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
